name: Update Dailymotion IPTV Playlist

on:
  schedule:
    # Tự động chạy mỗi 2 tiếng
    - cron: '0 */2 * * *'
  workflow_dispatch: # Cho phép chạy thủ công

# Bắt buộc: Cấp quyền ghi để Action có thể push code (Sửa lỗi 128)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Lấy toàn bộ lịch sử để rebase không bị lỗi
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt yt-dlp và thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -U "yt-dlp[default,curl-cffi]"

      - name: Chạy Script Python
        run: python scrape.py

      - name: Commit và Push file playlist
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u
          
          # Kiểm tra xem file có thay đổi thực sự không
          if git diff --staged --quiet; then
            echo "Không có video mới, bỏ qua commit."
          else
            git commit -m "Auto-update playlist.m3u [skip ci]"
            # Kéo code mới nhất từ nhánh main về để tránh lỗi xung đột
            git pull --rebase origin main
            git push
          fi
