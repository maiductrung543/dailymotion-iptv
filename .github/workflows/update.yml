name: Update Dailymotion IPTV Playlist

on:
  schedule:
    # Tự động chạy mỗi 2 tiếng (bạn có thể sửa lại thời gian tùy ý)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công bằng tay

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt yt-dlp và thư viện giả lập trình duyệt
        run: |
          python -m pip install --upgrade pip
          # Cài đặt bản yt-dlp mới nhất kèm theo curl-cffi để vượt rào
          pip install -U "yt-dlp[default,curl-cffi]"

      - name: Chạy Script
        run: python scrape.py

      - name: Commit và Push file playlist
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u
          # Lệnh commit, nếu không có thay đổi thì bỏ qua không báo lỗi
          git commit -m "Auto-update playlist.m3u" || echo "No changes to commit"
          git push
